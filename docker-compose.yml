version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: src/WinCraft.API/Dockerfile
    ports:
      - "5000:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Database=wincraft;Username=wincraft;Password=${DB_PASS}"
      Redis__Connection: "redis:6379"
      Jwt__Secret: "${JWT_SECRET}"
      AWS__Bucket: "wincraft-files"
      AWS__Region: "me-south-1"
      App__FrontendUrl: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend/wincraft-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: wincraft
      POSTGRES_USER: wincraft
      POSTGRES_PASSWORD: "${DB_PASS}"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wincraft"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  hangfire:
    build:
      context: .
      dockerfile: src/WinCraft.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Database=wincraft;Username=wincraft;Password=${DB_PASS}"
      Jwt__Secret: "${JWT_SECRET}"
      WORKER_ONLY: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
